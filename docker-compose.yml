# Stack completa para rodar a EfficiencIA local: frontend, backend, banco,
# n8n (orquestrador de IA), Qdrant (vetores) e Ollama (LLM local).
#
# Uso rápido:
#   cp .env.docker.example .env
#   docker compose up -d
#   docker compose logs -f backend
#
# As migrations rodam automaticamente quando o backend sobe.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (use openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/assist-bpmn}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-60000}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  n8n-data:
  qdrant-data:
  ollama-data:
  redis-data:
